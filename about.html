            <h1 style="font-size:28px; margin-bottom:20px; text-align:center;">How AI shopping assistants actually see your store</h1>
            <p style="color:#ccc; margin-bottom:20px;">ChatGPT, Perplexity, and other AI assistants can only recommend products they can read. Three things determine that: whether their crawlers can reach the page, whether the page has structured data describing the product, and whether the content exists in the raw HTML or only appears after JavaScript runs.</p>
            <p style="color:#ccc; margin-bottom:20px;"><strong>Crawler access:</strong> Answer bots like OAI-SearchBot, ChatGPT-User, and PerplexityBot fetch pages live to answer real questions. Training bots like GPTBot and ClaudeBot are separate and unrelated to today's visibility.</p>
            <p style="color:#ccc; margin-bottom:20px;"><strong>Structured data:</strong> A Product JSON-LD block should state the name, price, availability, rating, and product ID plainly — without it, assistants are guessing from marketing copy.</p>
            <p style="color:#ccc; margin-bottom:20px;"><strong>Content visibility:</strong> Most AI crawlers don't execute JavaScript. If your price or description only renders client-side, a human sees a normal page and a crawler sees almost nothing.</p>
