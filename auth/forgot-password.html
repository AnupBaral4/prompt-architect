<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Prompt Architect</title>
    <link rel="stylesheet" href="../styles.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-box {
            max-width: 450px;
            width: 100%;
            background: rgba(21, 21, 21, 0.95);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .auth-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88 0%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .auth-subtitle {
            font-size: 14px;
            color: #888;
            line-height: 1.6;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }
        
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            width: 100%;
            padding: 16px;
            background: transparent;
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
        }
        
        .btn-secondary:hover {
            background: rgba(0, 255, 136, 0.1);
            border-color: #00ff88;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }
        
        .message-success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }
        
        .message-error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff4444;
        }
        
        .message-info {
            background: rgba(100, 149, 237, 0.1);
            border: 1px solid rgba(100, 149, 237, 0.3);
            color: #6495ED;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #666;
        }
        
        .auth-footer a {
            color: #00ff88;
            text-decoration: none;
            font-weight: 600;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        .info-box {
            background: rgba(100, 149, 237, 0.05);
            border: 1px solid rgba(100, 149, 237, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 12px;
            color: #aaa;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="hero-bg"></div>
    
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1 class="auth-title">Reset Password</h1>
                <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
            </div>
            
            <div class="info-box">
                ℹ️ You'll receive an email with a link to reset your password. The link will expire in 1 hour.
            </div>
            
            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                    >
                </div>
                
                <button type="submit" class="btn-submit" id="submit-btn">
                    Send Reset Link
                </button>
                
                <button type="button" class="btn-secondary" onclick="window.location.href='login.html'">
                    Back to Login
                </button>
                
                <div id="message"></div>
            </form>
            
            <div class="auth-footer">
                Remember your password? 
                <a href="login.html">Log in</a>
            </div>
        </div>
    </div>
    
    <script src="../config/supabase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        // Handle password reset form submission
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const messageDiv = document.getElementById('message');
            
            // Clear previous message
            messageDiv.innerHTML = '';
            messageDiv.className = 'message';
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            
            try {
                // Send password reset email
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}/auth/reset-password.html`,
                });
                
                if (error) throw error;
                
                // Success!
                messageDiv.className = 'message message-success';
                messageDiv.innerHTML = '✅ Reset link sent! Check your email inbox.';
                
                // Keep button disabled
                submitBtn.textContent = 'Email Sent';
                
                // Show info message after 3 seconds
                setTimeout(() => {
                    messageDiv.className = 'message message-info';
                    messageDiv.innerHTML = '📧 Didn\'t receive it? Check your spam folder or try again in a few minutes.';
                }, 3000);
                
            } catch (error) {
                console.error('Password reset error:', error);
                
                // Provide user-friendly error message
                let errorMessage = error.message;
                
                if (error.message.includes('rate limit')) {
                    errorMessage = 'Too many requests. Please wait a few minutes and try again.';
                }
                
                messageDiv.className = 'message message-error';
                messageDiv.innerHTML = '❌ ' + errorMessage;
                
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
