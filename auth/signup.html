<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Prompt Architect</title>
    <link rel="stylesheet" href="../styles.css">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-box {
            max-width: 450px;
            width: 100%;
            background: rgba(21, 21, 21, 0.95);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .auth-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88 0%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .auth-subtitle {
            font-size: 14px;
            color: #888;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #888;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }
        
        .form-checkbox {
            margin-bottom: 24px;
            font-size: 12px;
            color: #888;
        }
        
        .form-checkbox input {
            margin-right: 8px;
        }
        
        .form-checkbox a {
            color: #00ff88;
            text-decoration: none;
        }
        
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }
        
        .message-success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }
        
        .message-error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff4444;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #666;
        }
        
        .auth-footer a {
            color: #00ff88;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="hero-bg"></div>
    
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1 class="auth-title">Join Community</h1>
                <p class="auth-subtitle">Create your anonymous account</p>
            </div>
            
            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label">Email (Private)</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="your@email.com"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label">Username (Public)</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="@YourUsername"
                        pattern="[a-zA-Z0-9_]{3,20}"
                        title="3-20 characters, letters, numbers, and underscores only"
                        required
                    >
                    <small style="font-size: 10px; color: #666; margin-top: 4px; display: block;">
                        This is how others will see you
                    </small>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="••••••••"
                        minlength="6"
                        required
                    >
                    <small style="font-size: 10px; color: #666; margin-top: 4px; display: block;">
                        Minimum 6 characters
                    </small>
                </div>
                
                <div class="form-checkbox">
                    <label>
                        <input type="checkbox" required>
                        I agree to the 
                        <a href="../legal/privacy.html" target="_blank">Privacy Policy</a> and 
                        <a href="../legal/terms.html" target="_blank">Terms of Service</a>
                    </label>
                </div>
                
                <button type="submit" class="btn-submit" id="submit-btn">
                    Create Account
                </button>
                
                <div id="message"></div>
            </form>
            
            <div class="auth-footer">
                Already have an account? 
                <a href="login.html">Log in</a>
            </div>
        </div>
    </div>
    
    <script src="../config/supabase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        // Handle sign up form submission
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');
            const messageDiv = document.getElementById('message');
            
            // Clear previous message
            messageDiv.innerHTML = '';
            messageDiv.className = 'message';
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
            
            try {
                // Check if username already exists
                const { data: existingUser } = await supabase
                    .from('profiles')
                    .select('username')
                    .eq('username', username)
                    .single();
                
                if (existingUser) {
                    throw new Error('Username already taken. Please choose another.');
                }
                
                // Sign up user
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            username: username
                        }
                    }
                });
                
                if (authError) throw authError;
                
                // Create profile
                const { error: profileError } = await supabase
                    .from('profiles')
                    .insert([{
                        id: authData.user.id,
                        username: username,
                        avatar_url: `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`,
                        bio: '',
                        posts_count: 0,
                        followers_count: 0,
                        following_count: 0
                    }]);
                
                if (profileError) throw profileError;
                
                // Success!
                messageDiv.className = 'message message-success';
                messageDiv.innerHTML = '✅ Account created! Check your email to verify.';
                
                // Redirect to community after 2 seconds
                setTimeout(() => {
                    window.location.href = '../community/feed.html';
                }, 2000);
                
            } catch (error) {
                console.error('Sign up error:', error);
                messageDiv.className = 'message message-error';
                messageDiv.innerHTML = '❌ ' + error.message;
                
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
