            <h1 style="font-size:28px; margin-bottom:20px; text-align:center;">Does your Shopify store actually have a JavaScript problem for AI crawlers?</h1>
            <p style="color:#ccc; margin-bottom:20px;">Most Shopify stores run on Liquid, which renders server-side — your content is already in the HTML before any JavaScript runs. Even Hydrogen, Shopify's headless framework, ships server-side rendering by default. So most Shopify themes are fine at the theme level.</p>
            <p style="color:#ccc; margin-bottom:20px;">The real risk is specific apps that inject content client-side instead of having Shopify render it up front: review widgets, dynamic pricing apps, and personalization sections are common culprits.</p>
            <p style="color:#ccc; margin-bottom:20px;">Check your own product pages by viewing raw source and searching for text you know is on the page. If it's missing, an app is likely injecting it client-side.</p>
