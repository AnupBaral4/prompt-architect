            <h1 style="font-size:28px; margin-bottom:20px; text-align:center;">We scanned real Shopify stores for AI visibility. One of them was ours.</h1>
            <p style="color:#ccc; margin-bottom:20px;">We tested our free AI-visibility scanner on real Shopify stores. Two small independent stores both scored 96/100, missing only review-rating schema. Then we scanned our own site, debnix.com — and got 0 characters of real text in the raw HTML, on both the homepage and our blog. The cause: a fully client-rendered React app with no server-side rendering, so AI crawlers that don't execute JavaScript saw an empty shell.</p>
            <p style="color:#ccc; margin-bottom:20px;">We fixed it with build-time prerendering scoped to the public marketing and blog routes. Content visibility went from 10 to 100 on both pages after the fix.</p>
            <p style="color:#ccc; margin-bottom:20px;"><strong>The lesson:</strong> crawler access rarely breaks by accident. The two things that actually go wrong are missing structured data and content that only exists after JavaScript runs — and the second one is invisible from a normal browser.</p>
